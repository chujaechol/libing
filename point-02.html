<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMBRA CERAMIC — DS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=40" />
</head>
<body>
  <nav class="top-nav is-scrolled" id="top-nav">
    <div class="top-nav__left">
      <a class="logo" href="index.html" aria-label="DS">
        <span class="logo__letter">D</span><span class="logo__sep" aria-hidden="true"></span><span class="logo__letter">S</span>
      </a>
      <div class="top-nav__links">
        <a class="nav-link is-active" href="materials.html#formats" data-tooltip="&#51088;&#51116;&#47532;&#49828;&#53944;"><span class="nav-label">Collections</span></a>
        <a class="nav-link" href="auxiliary.html#brands" data-tooltip="&#50577;&#48320;&#44592;&amp;&#49688;&#51204;&#47448;"><span class="nav-label">Materials</span></a>
        <a class="nav-link" href="top-picks.html" data-tooltip="&#52628;&#52380;&#49345;&#54408;"><span class="nav-label">Top picks</span></a>
        <a class="nav-link" href="photo-gallery.html" data-tooltip="&#49884;&#44277;&#49324;&#51652;"><span class="nav-label">Gallery</span></a>
      </div>
    </div>
  </nav>

  <main>
    <section class="gallery-page">
      <div class="gallery-page__inner">
        <a class="gallery-page__back" href="catalog.html?format=200x1200">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to Point
        </a>

        <div class="gallery-page__header">
          <span class="eyebrow">Partner Brand</span>
          <h1>AMBRA CERAMIC</h1>
          <p>PRODUCT &#52852;&#53580;&#44256;&#47532;&#47484; &#49440;&#53469;&#54616;&#49464;&#50836;</p>
        </div>

        <nav class="gallery-list" aria-label="AMBRA CERAMIC categories" id="ambra-categories"></nav>

        <p class="ambra-hub__note">
          &#50640;&#47532;&#54532;&#45716; <a href="https://ambraceramic.com/product" target="_blank" rel="noopener noreferrer">ambraceramic.com</a>
          PRODUCT &#44396;&#51312;&#47484; &#44592;&#51456;&#51004;&#47196; &#51221;&#47532;&#54633;&#45768;&#45796;.
        </p>
      </div>
    </section>
  </main>

  <script src="js/ambra-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.getElementById("ambra-categories");
      if (!root || !window.AMBRA_DATA) return;

      root.innerHTML = AMBRA_DATA.categories
        .map((cat) => {
          const count = AMBRA_DATA.seriesFor(cat.id).length;
          return `
            <a class="gallery-list__item" href="ambra-gallery.html?cat=${encodeURIComponent(cat.id)}">
              <span class="gallery-list__icon" aria-hidden="true">
                <span class="material-symbols-outlined">${cat.icon}</span>
              </span>
              <span class="gallery-list__num">${cat.number}</span>
              <span class="gallery-list__title">${cat.title}</span>
              <span class="gallery-list__meta">${cat.subtitle} · ${count}</span>
            </a>`;
        })
        .join("");
    });
  </script>
    <script src="js/search-index.js"></script>
  <script src="js/site-search.js"></script>
  <script src="js/back-to-top.js"></script>
</body>
</html>
