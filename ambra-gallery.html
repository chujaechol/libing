<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMBRA Gallery — DS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=42" />
</head>
<body>
  <nav class="top-nav is-scrolled" id="top-nav">
    <div class="top-nav__left">
      <a class="logo" href="index.html" aria-label="DS">
        <span class="logo__letter">D</span><span class="logo__sep" aria-hidden="true"></span><span class="logo__letter">S</span>
      </a>
      <div class="top-nav__links">
        <a class="nav-link is-active" href="materials.html#formats" data-tooltip="&#51088;&#51116;&#47532;&#49828;&#53944;"><span class="nav-label">Collections</span></a>
        <a class="nav-link" href="auxiliary.html#brands" data-tooltip="&#50577;&#48320;&#44592;&amp;&#49688;&#51204;&#47448;"><span class="nav-label">Materials</span></a>
        <a class="nav-link" href="top-picks.html" data-tooltip="&#52628;&#52380;&#49345;&#54408;"><span class="nav-label">Top picks</span></a>
        <a class="nav-link" href="photo-gallery.html" data-tooltip="&#49884;&#44277;&#49324;&#51652;"><span class="nav-label">Gallery</span></a>
      </div>
    </div>
  </nav>

  <main>
    <section class="gallery-page">
      <div class="gallery-page__inner" id="ambra-gallery-inner">
        <a class="gallery-page__back" href="point-02.html">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to AMBRA CERAMIC
        </a>

        <div class="gallery-page__header">
          <span class="eyebrow" id="ambra-cat-eyebrow">AMBRA CERAMIC</span>
          <h1 id="ambra-cat-title">Series</h1>
          <p id="ambra-cat-desc">시리즈를 선택하세요</p>
        </div>

        <nav class="gallery-list" aria-label="AMBRA series list" id="ambra-series-list"></nav>
        <div class="gallery-formats" id="ambra-series-grid" hidden></div>
      </div>
    </section>
  </main>

  <script src="js/ambra-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const catId = params.get("cat") || "wall";
      const cat = AMBRA_DATA.categoryById(catId) || AMBRA_DATA.categories[0];
      const list = AMBRA_DATA.seriesFor(cat.id);

      document.title = `${cat.title} — AMBRA CERAMIC`;
      document.getElementById("ambra-cat-eyebrow").textContent = "AMBRA · PRODUCT";
      document.getElementById("ambra-cat-title").textContent = cat.title;
      document.getElementById("ambra-cat-desc").textContent =
        `${cat.subtitle} · ${list.length} series`;

      const listEl = document.getElementById("ambra-series-list");
      const gridEl = document.getElementById("ambra-series-grid");
      const innerEl = document.getElementById("ambra-gallery-inner");

      if (cat.id === "wall") {
        listEl.hidden = true;
        gridEl.hidden = false;
        innerEl.classList.add("gallery-page__inner--wide");
        gridEl.innerHTML = list
          .map((item, index) => {
            const num = String(index + 1).padStart(2, "0");
            const title = `${item.size} ${item.name}`;
            const media = item.images && item.images[0]
              ? `<img src="${item.images[0].src}" alt="${title}" />`
              : `<span class="ambra-gallery-card__size">${item.size}</span><span class="ambra-gallery-card__name">${item.name}</span>`;
            const mediaClass = item.images && item.images[0] ? "" : " ambra-gallery-card";
            return `
              <a class="gallery-format gallery-format--link" href="ambra-detail.html?series=${encodeURIComponent(item.id)}">
                <div class="gallery-format__media${mediaClass}">
                  ${media}
                </div>
                <div class="gallery-format__caption">
                  <span class="gallery-format__num">${num}</span>
                  <span class="gallery-format__label">${title}</span>
                  <span class="gallery-format__action">상세 보기</span>
                </div>
              </a>`;
          })
          .join("");
        return;
      }

      listEl.innerHTML = list
        .map((item, index) => {
          const num = String(index + 1).padStart(2, "0");
          const title = item.name === "CARRARA" ? "CARRARA SERIES" : `${item.size} ${item.name}`;
          return `
            <a class="gallery-list__item" href="ambra-detail.html?series=${encodeURIComponent(item.id)}">
              <span class="gallery-list__icon" aria-hidden="true">
                <span class="material-symbols-outlined">${cat.icon}</span>
              </span>
              <span class="gallery-list__num">${num}</span>
              <span class="gallery-list__title">${title}</span>
              <span class="gallery-list__meta">${item.type}</span>
            </a>`;
        })
        .join("");
    });
  </script>
    <script src="js/search-index.js"></script>
  <script src="js/site-search.js"></script>
  <script src="js/back-to-top.js"></script>
</body>
</html>
