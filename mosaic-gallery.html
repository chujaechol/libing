<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모짜이크 Gallery — DS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=30" />
</head>
<body>
  <nav class="top-nav is-scrolled" id="top-nav">
    <div class="top-nav__left">
      <a class="logo" href="index.html" aria-label="DS">
        <span class="logo__letter">D</span><span class="logo__sep" aria-hidden="true"></span><span class="logo__letter">S</span>
      </a>
      <div class="top-nav__links">
        <a class="nav-link" href="index.html" data-tooltip="자재리스트"><span class="nav-label">Collections</span></a>
        <a class="nav-link is-active" href="material-list.html" data-tooltip="양변기&수전류"><span class="nav-label">Materials</span></a>
        <a class="nav-link" href="index.html#collections">Showroom</a>
        <a class="nav-link" href="index.html">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="gallery-page">
      <div class="gallery-page__inner gallery-page__inner--wide">
        <a class="gallery-page__back" id="mosaic-back" href="mosaic-categories.html">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to Categories
        </a>

        <div class="gallery-page__header">
          <span class="eyebrow" id="mosaic-eyebrow">모짜이크</span>
          <h1 id="mosaic-title">카테고리</h1>
          <p id="mosaic-count">규격별 카테고리</p>
        </div>

        <nav class="gallery-list" id="rect-size-list" aria-label="직사각 규격" hidden></nav>
        <div class="gallery-formats" id="gallery-formats" hidden></div>
      </div>
    </section>
  </main>

  <script src="js/mosaic-rect-data.js"></script>
  <script src="js/mosaic-flat-data.js"></script>
  <script>
    function productHref(name, backQuery) {
      return (
        "product.html?format=mosaic&product=" +
        encodeURIComponent(name) +
        "&from=mosaic&back=" +
        encodeURIComponent(backQuery)
      );
    }

    function renderProducts(items, formatsEl) {
      formatsEl.hidden = false;
      formatsEl.innerHTML = items
        .map((item) => {
          const num = String(item.n).padStart(2, "0");
          const href = productHref(item.name, item.back);
          return `
            <a class="gallery-format gallery-format--link" href="${href}">
              <div class="gallery-format__media">
                <img src="${item.src}" alt="${item.name}" loading="lazy" />
              </div>
              <div class="gallery-format__caption">
                <span class="gallery-format__num">${num}</span>
                <span class="gallery-format__label">${item.name}</span>
                <span class="gallery-format__action">상세 보기</span>
              </div>
            </a>`;
        })
        .join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const labels = {
        square: "정각",
        rect: "직사각",
        hex: "육각",
        circle: "원형",
        pattern: "모양",
      };

      const params = new URLSearchParams(window.location.search);
      const cat = params.get("cat") || "square";
      const sizeKey = params.get("size");
      const titleEl = document.getElementById("mosaic-title");
      const countEl = document.getElementById("mosaic-count");
      const eyebrowEl = document.getElementById("mosaic-eyebrow");
      const backEl = document.getElementById("mosaic-back");
      const sizeList = document.getElementById("rect-size-list");
      const formatsEl = document.getElementById("gallery-formats");
      const catTitle = labels[cat] || "모짜이크";

      if (cat === "rect" && window.MOSAIC_RECT) {
        if (!sizeKey) {
          titleEl.textContent = "직사각";
          countEl.textContent = `규격 ${MOSAIC_RECT.length}개 · 클릭 후 상세 확인`;
          document.title = "직사각 — 모짜이크 — DS";
          sizeList.hidden = false;
          sizeList.innerHTML = MOSAIC_RECT.map((size, i) => {
            const num = String(i + 1).padStart(2, "0");
            return `
              <a class="gallery-list__item" href="mosaic-gallery.html?cat=rect&size=${encodeURIComponent(size.key)}">
                <span class="gallery-list__icon" aria-hidden="true">
                  <span class="material-symbols-outlined">crop_16_9</span>
                </span>
                <span class="gallery-list__num">${num}</span>
                <span class="gallery-list__title">${size.label}</span>
                <span class="gallery-list__meta">${size.count} ITEMS</span>
              </a>`;
          }).join("");
          return;
        }

        const size = MOSAIC_RECT.find((s) => s.key === sizeKey);
        if (!size) {
          titleEl.textContent = "규격을 찾을 수 없습니다";
          return;
        }

        eyebrowEl.textContent = "모짜이크 · 직사각";
        titleEl.textContent = size.label;
        countEl.textContent = `${size.count} products · 상세 페이지 연결`;
        document.title = `${size.label} — 직사각 — DS`;
        backEl.href = "mosaic-gallery.html?cat=rect";
        backEl.innerHTML = `<span class="material-symbols-outlined">arrow_back</span> Back to 직사각`;

        renderProducts(
          size.items.map((item) => ({
            ...item,
            back: `cat=rect&size=${size.key}`,
          })),
          formatsEl
        );
        return;
      }

      const flat = window.MOSAIC_FLAT && MOSAIC_FLAT[cat];
      if (!flat) {
        titleEl.textContent = "카테고리를 찾을 수 없습니다";
        return;
      }

      titleEl.textContent = flat.label || catTitle;
      countEl.textContent = `${flat.count} products · 상세 페이지 연결`;
      document.title = `${flat.label || catTitle} — 모짜이크 — DS`;
      renderProducts(
        flat.items.map((item) => ({
          ...item,
          back: `cat=${cat}`,
        })),
        formatsEl
      );
    });
  </script>
</body>
</html>
