<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>600 &#215; 1200 Gallery — DS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=41" />
</head>
<body>
  <nav class="top-nav is-scrolled" id="top-nav">
    <div class="top-nav__left">
      <a class="logo" href="index.html" aria-label="DS">
        <span class="logo__letter">D</span><span class="logo__sep" aria-hidden="true"></span><span class="logo__letter">S</span>
      </a>
      <div class="top-nav__links">
        <a class="nav-link" href="materials.html#formats" data-tooltip="&#51088;&#51116;&#47532;&#49828;&#53944;"><span class="nav-label">Collections</span></a>
        <a class="nav-link" href="auxiliary.html#brands" data-tooltip="&#50577;&#48320;&#44592;&amp;&#49688;&#51204;&#47448;"><span class="nav-label">Materials</span></a>
        <a class="nav-link" href="top-picks.html" data-tooltip="&#52628;&#52380;&#49345;&#54408;"><span class="nav-label">Top picks</span></a>
        <a class="nav-link is-active" href="photo-gallery.html" data-tooltip="&#49884;&#44277;&#49324;&#51652;"><span class="nav-label">Gallery</span></a>
      </div>
    </div>
  </nav>

  <main>
    <section class="gallery-page">
      <div class="gallery-page__inner" id="gallery-hub-inner">
        <a class="gallery-page__back" href="photo-gallery.html" id="gallery-back">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to Categories
        </a>

        <div class="gallery-page__header">
          <span class="eyebrow">Collection 04</span>
          <h1 id="gallery-title">600 &#215; 1200 Gallery</h1>
          <p id="gallery-subtitle">&#49884;&#44277;&#49324;&#51652; &#52852;&#53580;&#44256;&#47532;&#47484; &#49440;&#53469;&#54616;&#49464;&#50836;</p>
        </div>

        <nav class="gallery-list" aria-label="600 x 1200 gallery categories" id="gallery-600x1200-categories">
          <a class="gallery-list__item" href="gallery-600x1200.html?cat=bathroom">
            <span class="gallery-list__icon" aria-hidden="true">
              <span class="material-symbols-outlined">bathtub</span>
            </span>
            <span class="gallery-list__num">01</span>
            <span class="gallery-list__title">&#50837;&#49892;</span>
            <span class="gallery-list__meta">Bathroom</span>
          </a>
          <a class="gallery-list__item" href="gallery-600x1200.html?cat=living">
            <span class="gallery-list__icon" aria-hidden="true">
              <span class="material-symbols-outlined">weekend</span>
            </span>
            <span class="gallery-list__num">02</span>
            <span class="gallery-list__title">&#44144;&#49892;</span>
            <span class="gallery-list__meta">Living</span>
          </a>
          <a class="gallery-list__item" href="gallery-600x1200.html?cat=lobby">
            <span class="gallery-list__icon" aria-hidden="true">
              <span class="material-symbols-outlined">apartment</span>
            </span>
            <span class="gallery-list__num">03</span>
            <span class="gallery-list__title">&#47196;&#48708; &#183; &#48373;&#46020;</span>
            <span class="gallery-list__meta">Lobby</span>
          </a>
        </nav>

        <div class="gallery-formats" id="gallery-formats" hidden></div>

        <div id="gallery-empty" class="gallery-page__empty" hidden>
          <p class="gallery-page__empty-title">&#51456;&#48708; &#51473;</p>
          <p id="gallery-empty-desc">&#54644;&#45817; &#52852;&#53580;&#44256;&#47532; &#49884;&#44277;&#49324;&#51652;&#47484; &#44279; &#50629;&#45936;&#51060;&#53944;&#54624; &#50696;&#51221;&#51077;&#45768;&#45796;.</p>
          <a class="btn btn--dark" href="gallery-600x1200.html">&#52852;&#53580;&#44256;&#47532; &#47785;&#47197;</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cat = new URLSearchParams(window.location.search).get("cat");
      const labels = {
        bathroom: "Bathroom",
        living: "Living",
        lobby: "Lobby",
      };
      const titles = {
        bathroom: "\uC695\uC2E4",
        living: "\uAC70\uC2E4",
        lobby: "\uB85C\uBE44 \u00B7 \uBCF5\uB3C4",
      };
      const subtitles = {
        bathroom: "600 \u00D7 1200 mm \u00B7 Format 1 \u2014 3",
        living: "600 \u00D7 1200 mm \u00B7 Living installation",
        lobby: "600 \u00D7 1200 mm \u00B7 Lobby / corridor installation",
      };
      const photos = {
        bathroom: [
          {
            n: 1,
            src: "assets/gallery/600x1200/bathroom/01.png",
            alt: "600 \u00D7 1200 Bathroom 01",
          },
          {
            n: 2,
            src: "assets/gallery/600x1200/bathroom/02.png",
            alt: "600 \u00D7 1200 Bathroom 02",
          },
          {
            n: 3,
            src: "assets/gallery/600x1200/bathroom/03.png",
            alt: "600 \u00D7 1200 Bathroom 03",
          },
        ],
      };

      if (!cat || !labels[cat]) return;

      const inner = document.getElementById("gallery-hub-inner");
      inner.classList.add("gallery-page__inner--wide");

      document.title = `600 \u00D7 1200 ${titles[cat]} — DS`;
      document.getElementById("gallery-title").textContent = titles[cat];
      document.getElementById("gallery-subtitle").textContent = subtitles[cat];
      document.getElementById("gallery-600x1200-categories").hidden = true;

      const back = document.getElementById("gallery-back");
      back.href = "gallery-600x1200.html";
      back.innerHTML =
        '<span class="material-symbols-outlined">arrow_back</span> Back to 600 \u00D7 1200';

      const list = photos[cat];
      if (!list || !list.length) {
        document.getElementById("gallery-empty").hidden = false;
        document.getElementById("gallery-empty-desc").textContent =
          `${titles[cat]} \uC2DC\uACF5\uC0AC\uC9C4\uC744 \uACE7 \uC5C5\uB370\uC774\uD2B8\uD560 \uC608\uC815\uC785\uB2C8\uB2E4.`;
        return;
      }

      const root = document.getElementById("gallery-formats");
      root.hidden = false;
      root.innerHTML = list
        .map((item) => {
          const label = `Format ${item.n}`;
          const num = String(item.n).padStart(2, "0");
          return `
            <figure class="gallery-format">
              <div class="gallery-format__media">
                <img src="${item.src}" alt="${item.alt || label}" />
              </div>
              <figcaption class="gallery-format__caption">
                <span class="gallery-format__num">${num}</span>
                <span class="gallery-format__label">${label}</span>
              </figcaption>
            </figure>`;
        })
        .join("");
    });
  </script>
</body>
</html>
